# Living here (not in the repo root) is deliberate: it anchors pytest's
# rootdir to tests/, keeping the repo root out of the collection tree. The
# root is a Python package (Hermes plugins require __init__.py at the plugin
# root, with relative imports), and pytest >= 8 would try to import it
# standalone during collection and fail. Invoke the suite as: pytest tests
[pytest]
addopts = -q
