# Cheap drift alarm: verifies the live ClawBank MCP surface still has the
# shape this plugin depends on. Runs weekly and on demand. If a
# CLAWBANK_TEST_TOKEN secret is configured, it also loads the real catalog
# through the plugin's own client.

name: Live surface check

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check live MCP surface
        env:
          CLAWBANK_TEST_TOKEN: ${{ secrets.CLAWBANK_TEST_TOKEN }}
        run: python scripts/live_check.py
