name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest tests

  real-hermes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned Hermes runtime
        run: >-
          pip install
          "git+https://github.com/NousResearch/hermes-agent.git@199f55805876965fadea0f7a7ef29ae9128602ec"
      - name: Install plugin into an isolated Hermes home
        run: |
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          mkdir -p "$HERMES_HOME/plugins/clawbank"
          rsync -a --exclude=.git "$GITHUB_WORKSPACE/" "$HERMES_HOME/plugins/clawbank/"
          python -c 'import os; from pathlib import Path; Path(os.environ["HERMES_HOME"], "config.yaml").write_text("plugins:\n  enabled:\n    - clawbank\n", encoding="utf-8")'
      - name: Exercise real plugin discovery and registration
        run: |
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          python scripts/real_hermes_check.py
