name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest tests

  # Loads the plugin through a real hermes-agent release — actual discovery,
  # actual PluginContext, actual tool registry and dispatch. Pinned to the
  # declared minimum supported Hermes version so a Hermes API change that
  # would break real installs fails here, not on users' machines.
  hermes-integration:
    name: Real Hermes integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pytest and real Hermes (pinned minimum supported version)
        run: pip install pytest "hermes-agent==0.19.0"
      - name: Show resolved Hermes version
        run: pip show hermes-agent | head -2
      - name: Integration tests against real Hermes
        run: pytest tests/test_hermes_integration.py -v
